    <script>
      (function () {
        var search = window.location.search;
        if (search.indexOf('?/') === 0) {
          var payload = search.slice(2);
          var queryIndex = payload.indexOf('&');
          var route = queryIndex === -1 ? payload : payload.slice(0, queryIndex);
          var query = queryIndex === -1 ? '' : '?' + payload.slice(queryIndex + 1).replace(/~and~/g, '&');
          window.history.replaceState(null, '', '/' + route + query + window.location.hash);
        }
      })();
    </script>

    <!-- Built-in Web Ad & Pop-up Blocker Engine -->
    <script>
      (function() {
        // Register Service Worker AdBlocker for intercepting ad networks
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }

        // Pop-up Overriding: Strictly forbid opening ANY window outside the site
        window.open = function(url, name, specs, replace) {
          console.warn('[FLEXJO Shield] Blocked external window open attempt to:', url);
          return {
            close: function() {},
            focus: function() {},
            blur: function() {},
            location: { href: '' },
            closed: false,
          };
        };

        // Strict Link & Target Blank Interceptor
        document.addEventListener('click', function(e) {
          let node = e.target;
          while (node && node !== document.body && node !== document.documentElement) {
            if (node.tagName === 'A') {
              const target = node.getAttribute('target');
              if (target === '_blank') {
                node.removeAttribute('target');
                const href = node.getAttribute('href') || '';
                if (href.startsWith('http') && !href.includes(window.location.hostname)) {
                  e.preventDefault();
                  e.stopPropagation();
                  console.warn('[FLEXJO Shield] Blocked opening external window via link:', href);
                  return false;
                }
              }
              break;
            }
            node = node.parentElement;
          }
        }, true);
      })();
    </script>
