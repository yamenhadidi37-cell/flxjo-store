<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Loading…</title>
    <script>
      (function () {
        var path = window.location.pathname.replace(/^\/+/, '');
        var query = window.location.search.replace(/^\?/, '&');
        var target = '/?/' + path + query + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
